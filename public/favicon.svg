<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <!-- Broccoli crown - left cluster -->
  <circle cx="20" cy="34" r="9" fill="#0a0a0a"/>
  <!-- Broccoli crown - right cluster -->
  <circle cx="38" cy="36" r="9" fill="#0a0a0a"/>
  <!-- Broccoli crown - center top -->
  <circle cx="30" cy="28" r="10" fill="#0a0a0a"/>
  <!-- Broccoli crown - top left -->
  <circle cx="23" cy="25" r="7" fill="#0a0a0a"/>
  <!-- Broccoli crown - top right -->
  <circle cx="37" cy="27" r="7" fill="#0a0a0a"/>
  <!-- Broccoli crown - very top -->
  <circle cx="30" cy="21" r="6" fill="#0a0a0a"/>
  <!-- Shorter stem, slightly tilted -->
  <rect x="30" y="36" width="6" height="12" rx="3" fill="#0a0a0a" transform="rotate(12 33 42)"/>
</svg>